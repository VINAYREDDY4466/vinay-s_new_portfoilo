<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#070812" />
    <script>
      // Applies the saved/system theme before first paint to avoid a light/dark flash.
      (function () {
        var root = document.documentElement;
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          root.classList.toggle('dark', theme === 'dark');
        } catch (error) {
          root.classList.add('dark');
        }
      })();
    </script>

    <title>Vinay Kumar — Full-Stack Developer</title>
    <meta name="description" content="Full-stack developer crafting fast, scalable and beautiful web products. Open to freelance and full-time opportunities." />
